[service.rpc]
reserve = "ReserveRequest -> ReserveResponse"

[msg.ReserveRequest.struct]
owner_id = "string"
quantity = "int"
note = { type = "string", optional = true }

[msg.Reservation.struct]
id = "string"

[msg.Problem.struct]
code = "string"
message = "string"

[msg.ReserveResponse.variant]
Reserved = "Reservation"
Rejected = "Problem"
Unavailable = "void"

[msg.ReservationBatch.struct]
items = { type = "list", of = "Reservation" }

[msg.Guard.struct]
big = "int"
small = "int"
ratio = "float"
label = "string"

[msg.ListBox.struct]
items = { type = "list", of = "Reservation", optional = true }

[msg.ResponseBox.struct]
response = { type = "ReserveResponse", optional = true }

[msg.Scalars.struct]
count = "int"
ratio = "float"
enabled = "bool"
name = "string"
date = "date"